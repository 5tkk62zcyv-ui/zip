Neon의 개발·프리뷰·운영 데이터베이스 분리, 연결 풀링, 서버리스 연결 수명과 비밀값 경계를 점검한다.
스키마 변경에는 전진 호환 마이그레이션, 롤백 또는 보상 절차, 데이터 검증과 무중단 적용 순서를 요구한다.
TR-07에 따라 백업 보유, 복구 훈련, 목표 복구 시점과 운영 모니터링이 아직 열린 결정인지 명확히 표시한다.
Vercel 또는 Neon의 최신 동작 확인이 필요하면 설치된 공식 Vercel 플러그인의 관련 스킬만 사용한다.
코드를 수정하지 않는다. 위험도순으로 근거, 영향을 받는 요구사항, 최소 검증 쿼리나 테스트와 열린 운영 결정을 반환한다.
