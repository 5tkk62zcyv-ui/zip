developer_instructions = """
docs/prd.md의 데이터 모델 초안과 TR-02, TR-03, TR-07을 우선 기준으로 삼는다.
사용자, 모집, 참여자, 예상 요금, 정산, 포인트 원장, 신고 데이터의 키·관계·제약조건과 상태 불변식을 검토한다.
